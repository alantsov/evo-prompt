<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Generation Inspector</title>
  <style>
    :root {
      --bg: #0f1115;
      --card-bg: #181b21;
      --text: #e6e9ef;
      --text-muted: #8b92a5;
      --border: #2a2f3a;
      --accent: #6c63ff;
      --accent-hover: #5a52d5;
      --score-2: #22c55e;
      --score-1: #f59e0b;
      --score-0: #ef4444;
      --score-na: #6b7280;
      --radius: 8px;
      --shadow: 0 4px 12px rgba(0,0,0,0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1 { font-size: 1.5rem; font-weight: 600; }

    #intent-banner {
      background: linear-gradient(90deg, #1a1d24, #15181e);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: var(--radius);
      font-size: 1rem;
      display: none;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      flex-wrap: wrap;
    }
    .intent-label {
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }
    #intent-text {
      color: var(--text);
      font-weight: 500;
      font-style: italic;
    }

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    input, select, button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 0.9rem;
    }

    button {
      cursor: pointer;
      background: var(--accent);
      border: none;
      font-weight: 500;
    }
    button:hover { background: var(--accent-hover); }

    #file-input { display: none; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s;
    }
    .card:hover { transform: translateY(-2px); }

    .card-img {
      width: 100%;
      object-fit: cover;
      cursor: zoom-in;
      background: #000;
    }

    .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

    .meta {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.75rem;
      white-space: nowrap;
    }
    .badge-score { background: #333; color: var(--text); }
    .badge-gen { background: #2a2f3a; color: var(--text-muted); }

    .prompt-box {
      background: #23262e;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 0.85rem;
      color: var(--text-muted);
      min-height: 60px;
      max-height: 180px;
      overflow-y: auto;
      white-space: pre-wrap;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }
    .prompt-box::-webkit-scrollbar { width: 6px; }
    .prompt-box::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    .reasoning-btn {
      background: var(--card-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 4px;
      transition: all 0.2s;
    }
    .reasoning-btn:hover { background: var(--accent); color: #fff; }

    .reasoning-box {
      display: none;
      margin-top: 4px;
      background: #23262e;
      padding: 12px;
      border-radius: var(--radius);
      font-size: 0.8rem;
      max-height: 240px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }
    .reasoning-box.visible { display: block; }
    .reasoning-item { margin-bottom: 10px; }
    .reasoning-item:last-child { margin-bottom: 0; }
    .reasoning-item strong { color: var(--accent); display: block; margin-bottom: 4px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .reasoning-item p { color: var(--text-muted); white-space: pre-wrap; margin: 0; line-height: 1.4; font-size: 0.8rem; }

    .rubric {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.8rem;
    }

    .rubric-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }
    .rubric-item:last-child { border-bottom: none; }

    .rubric-score {
      display: inline-block;
      width: 22px;
      height: 22px;
      line-height: 22px;
      text-align: center;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
    }

    .note {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-style: italic;
      padding-left: 8px;
      border-left: 2px solid #333;
    }

    /* ---------- Modal ---------- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }
    .modal.active { display: flex; }

    .modal-content {
      display: flex;
      align-items: center;
      gap: 20px;
      max-width: 94%;
      max-height: 94%;
    }

    #modal-img {
      flex: 0 1 auto;
      min-width: 0;
      max-width: calc(94vw - 450px);
      max-height: 94vh;
      object-fit: contain;
      border-radius: 4px;
      background: #000;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    #modal-img.swapping { animation: img-swap 0.18s ease; }
    @keyframes img-swap {
      from { opacity: 0.25; transform: scale(0.99); }
      to   { opacity: 1;    transform: scale(1); }
    }
    .modal.active .modal-content { animation: modal-pop 0.18s ease; }
    @keyframes modal-pop {
      from { opacity: 0; transform: translateY(6px) scale(0.985); }
      to   { opacity: 1; transform: none; }
    }

    .modal-panel {
      flex: 0 0 800px;
      max-width: 40vw;
      max-height: 94vh;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      cursor: default;
      box-shadow: var(--shadow);
    }
    .modal-panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .modal-panel-title {
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
    }
    .modal-counter {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .modal-panel-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 10px 16px 0;
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .modal-prompt {
      flex: 1;
      padding: 14px 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      cursor: default;
      scrollbar-width: thin;
      scrollbar-color: #444 transparent;
    }
    .modal-prompt::-webkit-scrollbar { width: 6px; }
    .modal-prompt::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .modal-prompt p {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
      line-height: 1.6;
      color: var(--text);
    }
    .modal-prompt p.empty { color: var(--text-muted); font-style: italic; }

    .modal-btn {
      position: fixed;
      z-index: 1001;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(24, 27, 33, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.15rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .modal-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #modal-close {
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      font-size: 1rem;
    }
    #modal-close:hover { transform: scale(1.08); }
    #modal-prev { left: 16px;  top: 50%; transform: translateY(-50%); }
    #modal-next { right: 16px; top: 50%; transform: translateY(-50%); }
    #modal-prev:hover { transform: translateY(-50%) scale(1.08); }
    #modal-next:hover { transform: translateY(-50%) scale(1.08); }

    .modal-hint {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1001;
      padding: 4px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(24, 27, 33, 0.75);
      color: var(--text-muted);
      font-size: 0.72rem;
      white-space: nowrap;
      pointer-events: none;
    }

    .empty-state {
      text-align: center;
      color: var(--text-muted);
      padding: 40px;
      grid-column: 1 / -1;
    }

    @media (max-width: 900px) {
      .modal-content {
        flex-direction: column;
        gap: 12px;
        max-width: 96%;
        max-height: 96%;
      }
      #modal-img {
        max-width: 92vw;
        max-height: 50vh;
      }
      .modal-panel {
        flex: 0 1 auto;
        width: 92vw;
        max-width: 92vw;
        max-height: 38vh;
      }
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .card-img { height: 200px; }
      .prompt-box { max-height: 240px; }
      #intent-banner { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🔍 Generation Inspector</h1>
    <div>
      <input type="file" id="file-input" accept=".json">
      <button onclick="document.getElementById('file-input').click()">📂 Load JSON</button>
    </div>
  </header>

  <div id="intent-banner">
    <span class="intent-label">🎯 Intent:</span>
    <span id="intent-text"></span>
  </div>

  <div class="controls">
    <input type="text" id="search" placeholder="Search prompt, intent, or generator...">
    <select id="sort-by">
      <option value="score-desc">Score: High → Low</option>
      <option value="score-asc">Score: Low → High</option>
      <option value="gen-desc">Generation: New → Old</option>
      <option value="gen-asc">Generation: Old → New</option>
    </select>
  </div>

  <main id="grid" class="grid">
    <div class="empty-state">Place your log in <code>data/log.json</code> or use the button to load it manually.</div>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Image viewer">
    <button type="button" id="modal-close" class="modal-btn" aria-label="Close viewer">✕</button>
    <button type="button" id="modal-prev" class="modal-btn" aria-label="Previous image">‹</button>
    <button type="button" id="modal-next" class="modal-btn" aria-label="Next image">›</button>

    <div class="modal-content">
      <img id="modal-img" src="" alt="">
      <div id="modal-panel" class="modal-panel">
        <div class="modal-panel-head">
          <span class="modal-panel-title">📝 Prompt</span>
          <span id="modal-counter" class="modal-counter"></span>
        </div>
        <div id="modal-meta" class="modal-panel-meta"></div>
        <div id="modal-prompt" class="modal-prompt"></div>
      </div>
    </div>

    <div id="modal-hint" class="modal-hint">← / → to browse · Esc to close</div>
  </div>

  <script>
    const ASSET_DIR = 'data/';

    let rawData = [];
    let currentList = []; // items in the order currently shown in the grid
    let modalIndex = 0;   // position of the image currently in the modal

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('search');
    const sortSelect = document.getElementById('sort-by');
    const modal = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalPanel = document.getElementById('modal-panel');
    const modalPrompt = document.getElementById('modal-prompt');
    const modalMeta = document.getElementById('modal-meta');
    const modalCounter = document.getElementById('modal-counter');
    const modalPrev = document.getElementById('modal-prev');
    const modalNext = document.getElementById('modal-next');
    const modalClose = document.getElementById('modal-close');
    const modalHint = document.getElementById('modal-hint');
    const fileInput = document.getElementById('file-input');
    const intentBanner = document.getElementById('intent-banner');
    const intentText = document.getElementById('intent-text');

    function escapeHtml(text) {
      if (!text) return 'N/A';
      const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
      return String(text).replace(/[&<>"']/g, (m) => map[m]);
    }

    function toggleReasoning(btn) {
      const box = btn.nextElementSibling;
      const isVisible = box.classList.contains('visible');
      if (isVisible) {
        box.classList.remove('visible');
        btn.textContent = btn.dataset.label;
      } else {
        box.classList.add('visible');
        btn.textContent = btn.dataset.hideLabel;
      }
    }

    function updateIntentBanner() {
      if (rawData.length > 0 && rawData[0]?.intent) {
        intentText.textContent = rawData[0].intent;
        intentBanner.style.display = 'flex';
      } else {
        intentBanner.style.display = 'none';
      }
    }

    (async () => {
      try {
        const res = await fetch(`${ASSET_DIR}log.json`);
        if (res.ok) {
          rawData = await res.json();
          updateIntentBanner();
          render();
        }
      } catch (e) {
        console.log('Auto-load skipped. Use file picker or check that data/log.json exists.');
      }
    })();

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          rawData = JSON.parse(ev.target.result);
          updateIntentBanner();
          render();
        } catch (err) {
          alert('Invalid JSON file.');
        }
      };
      reader.readAsText(file);
    });

    searchInput.addEventListener('input', render);
    sortSelect.addEventListener('change', render);

    function getScoreColor(score) {
      if (score === 'N/A') return 'var(--score-na)';
      const n = Number(score);
      if (n === 2) return 'var(--score-2)';
      if (n === 1) return 'var(--score-1)';
      return 'var(--score-0)';
    }

    function processPath(path) {
      const filename = path.split('/').pop();
      return `${ASSET_DIR}${filename}`;
    }

    function filterAndSort() {
      let data = [...rawData];
      const q = searchInput.value.toLowerCase().trim();

      if (q) {
        data = data.filter(d =>
          (d.prompt || '').toLowerCase().includes(q) ||
          (d.intent || '').toLowerCase().includes(q) ||
          (d.generated_by || '').toLowerCase().includes(q)
        );
      }

      const sort = sortSelect.value;
      data.sort((a, b) => {
        if (sort === 'score-desc') return (b.scalar_score ?? -1) - (a.scalar_score ?? -1);
        if (sort === 'score-asc') return (a.scalar_score ?? -1) - (b.scalar_score ?? -1);
        if (sort === 'gen-desc') return (b.generation ?? -1) - (a.generation ?? -1);
        if (sort === 'gen-asc') return (a.generation ?? -1) - (b.generation ?? -1);
        return 0;
      });

      return data;
    }

    function render() {
      if (rawData.length === 0) {
        currentList = [];
        grid.innerHTML = '<div class="empty-state">Place your log in <code>data/log.json</code> or use the button to load it manually.</div>';
        return;
      }

      const data = filterAndSort();
      currentList = data;

      if (data.length === 0) {
        grid.innerHTML = '<div class="empty-state">No results match your search.</div>';
        return;
      }

      grid.innerHTML = data.map((item, i) => {
        const imgUrl = processPath(item.image_path);
        const imageAlt = item.prompt ? escapeHtml(item.prompt) : '';
        const scoreBadge = `<span class="badge badge-score">Score: ${item.scalar_score ?? '-'}</span>`;
        const genBadge = `<span class="badge badge-gen">Gen #${item.generation ?? '?'}</span>`;
        const genByText = `<span>🛠 ${escapeHtml(item.generated_by || 'Unknown')}</span>`;

        let rubricHtml = '';
        if (item.rubric) {
          rubricHtml = Object.entries(item.rubric).map(([key, val]) => {
            if (key === 'scoring_reasoning') return '';
            const score = val.score ?? 'N/A';
            const color = getScoreColor(score);
            return `
              <div class="rubric-item">
                <span>${key}</span>
                <span class="rubric-score" style="background:${color}">${score}</span>
              </div>
              ${val.note ? `<div class="note">${val.note}</div>` : ''}
            `;
          }).join('');
        }

        const pReasoning = escapeHtml(item.prompt_reasoning || 'No generation reasoning available.');
        const sReasoning = escapeHtml(item.scoring_reasoning || 'No scoring reasoning available.');

        return `
          <div class="card">
            <img class="card-img" src="${imgUrl}" alt="Prompt" data-index="${i}" onclick="openModal(this)" loading="lazy">
            <div class="card-body">
              <div class="meta">
                ${scoreBadge}
                ${genBadge}
                ${genByText}
              </div>
              <div class="prompt-box">${item.prompt || 'No prompt'}</div>
              <button class="reasoning-btn" data-label="🔄 Show Prompt Reasoning" data-hide-label="🔄 Hide Prompt Reasoning" onclick="toggleReasoning(this)">🔄 Show Prompt Reasoning</button>
              <div class="reasoning-box">
                <div class="reasoning-item"><p>${pReasoning}</p></div>
              </div>
              <button class="reasoning-btn" data-label="⚖️ Show Scoring Reasoning" data-hide-label="⚖️ Hide Scoring Reasoning" onclick="toggleReasoning(this)">⚖️ Show Scoring Reasoning</button>
              <div class="reasoning-box">
                <div class="reasoning-item"><p>${sReasoning}</p></div>
              </div>
              ${rubricHtml ? `<div class="rubric">${rubricHtml}</div>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    /* ---------- Modal ---------- */

    // Splits a prompt into paragraphs on empty (or whitespace-only) lines.
    function buildPromptParagraphs(prompt) {
      const text = String(prompt || '').replace(/\r\n/g, '\n');
      if (!text.trim()) return '<p class="empty">No prompt available.</p>';
      const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
      if (paragraphs.length === 0) return '<p class="empty">No prompt available.</p>';
      return paragraphs.map(p => `<p>${escapeHtml(p)}</p>`).join('');
    }

    function showModalItem() {
      if (currentList.length === 0) {
        closeModal();
        return;
      }
      // Wrap around within the currently visible (filtered/sorted) list
      modalIndex = ((modalIndex % currentList.length) + currentList.length) % currentList.length;
      const item = currentList[modalIndex];

      modalImg.classList.remove('swapping');
      void modalImg.offsetWidth; // force reflow so the swap animation can restart
      modalImg.src = processPath(item.image_path);
      modalImg.alt = '';
      modalImg.classList.add('swapping');

      modalPrompt.innerHTML = buildPromptParagraphs(item.prompt);
      modalPrompt.scrollTop = 0;
      modalMeta.innerHTML = `
        <span class="badge badge-score">Score: ${item.scalar_score ?? '-'}</span>
        <span class="badge badge-gen">Gen #${item.generation ?? '?'}</span>
        <span>🛠 ${escapeHtml(item.generated_by || 'Unknown')}</span>
      `;
      modalCounter.textContent = `${modalIndex + 1} / ${currentList.length}`;

      const multi = currentList.length > 1;
      modalPrev.style.display = multi ? '' : 'none';
      modalNext.style.display = multi ? '' : 'none';
      modalHint.style.display = multi ? '' : 'none';
    }

    function openModal(img) {
      const idx = Number(img.dataset.index);
      modalIndex = Number.isFinite(idx) ? idx : 0;
      document.body.style.overflow = 'hidden';
      showModalItem();
      modal.classList.add('active');
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
    }

    function stepModal(direction) {
      if (currentList.length < 2) return;
      modalIndex = (modalIndex + direction + currentList.length) % currentList.length;
      showModalItem();
    }

    modal.addEventListener('click', closeModal);
    modalPanel.addEventListener('click', (e) => e.stopPropagation()); // don't close when reading/selecting the prompt
    modalClose.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });
    modalPrev.addEventListener('click', (e) => { e.stopPropagation(); stepModal(-1); });
    modalNext.addEventListener('click', (e) => { e.stopPropagation(); stepModal(1); });

    document.addEventListener('keydown', (e) => {
      if (!modal.classList.contains('active')) return;
      if (e.key === 'Escape') {
        e.preventDefault();
        closeModal();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        stepModal(1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        stepModal(-1);
      }
    });
  </script>
</body>
</html>
