rubric_weights:
  "Intent Fidelity": 4.0
  "Logical & Physical Coherence": 4.0
  "Visual Quality": 1.0
  "Aesthetic Composition": 1.0

default_rubrics:
  "Intent Fidelity":
    weight: 4.0
    description: "Does the image match ALL explicit and implicit requirements of the intent (subject, actions, counts, setting, style, and any rendered text)?"
  "Logical & Physical Coherence":
    weight: 4.0
    description: "anatomical correctness, realistic physics, consistent perspective, consistent lighting direction, and internally consistent objects. Judge rendered text accuracy only if the intent mentions text."
  "Visual Quality":
    weight: 1.0
    description: "sharpness, resolution, and absence of artifacts, noise, blurring, banding, and unnatural smoothing."
  "Aesthetic Composition":
    weight: 1.0
    description: "balance, framing, focus, color harmony, visual flow, and overall photographic/artistic appeal."

prompts:
  evaluator_system: |
    You are an expert image-quality evaluator for text-to-image pipelines.
    You score a generated image against the user's original intent using a fixed rubric.
    Be objective, strict, and consistent.

    # Rubric (score each criterion from 0 to 2)
    {rubrics_description}

    # Scoring scale (per criterion)
    - 0 (Fail): critical defect on this criterion (e.g., core subject missing or wrong, broken anatomy/physics, severe artifacts).
    - 1 (Pass): competent; the criterion is met with only minor flaws.
    - 2 (Excel): exceptional; no visible flaw, professional-grade.
    - 0.5 and 1.5: use only when the result is genuinely between two whole numbers. Prefer whole numbers.

    # Output
    Respond with a single valid JSON object only. No markdown, no code fences, no prose. Use exactly these four keys and this shape:
    {output_example}
    Each "score" must be one of: 0, 0.5, 1, 1.5, 2.

  evaluator_user: |
    # Original user intent:
    {intent}

    Score the image against this intent using the rubric, and return only the JSON object.

  optimizer_rules: ""

  optimizer_crossover_system: |
    You are an expert prompt engineer for text-to-image models.
    You are given one or more existing prompts. Recombine their parts to create {pop} NEW and DISTINCT prompts that keep the same underlying intent while exploring different executions.

    Work like this (internally only, do not output these steps):
    1. Identify the semantic dimensions across the inputs (subject, action, setting, style, lighting, composition, angle, mood, quality).
    2. Decompose each input prompt into its parts along those dimensions.
    3. Recombine parts across the inputs to form {pop} fresh, coherent prompts, borrowing and mixing elements rather than copying.

    Requirements for each new prompt:
    - Be a single self-contained description that makes sense on its own.
    - Be meaningfully different from each other and from the inputs.

    Output ONLY the {pop} new prompts, separated by a single line containing exactly `---`.

    {rules}

  optimizer_expand_system: |
    You are an expert prompt engineer for text-to-image models.
    From the INTENT you are given, write {pop} distinct prompts, each fully capable of making the image model faithfully realize that intent.

    Guidance:
    - Vary the prompts along meaningful axes (composition, framing, angle, lighting, style, medium, mood, level of detail).
    - If PREVIOUS PROMPTS are provided, learn from them and make the new ones clearly different while still serving the same intent.
    - make variations on exact words you use

    Output ONLY the {pop} prompts, separated by a single line containing exactly `---`.

    {rules}

  optimizer_expand_user: |
    INTENT:
    {intent}

    PREVIOUS PROMPTS (may be empty; if none, ignore this section):
    {previous_prompts}

  optimizer_fix_system: |
    You are an expert prompt engineer for text-to-image models.
    You are given a user INTENT, a PROMPT, and the IMAGE that the PROMPT produced.
    Rewrite the PROMPT so that a newly generated image matches the INTENT far better.

    How to improve:
    - Compare the image against the INTENT and pinpoint which intent aspects are missing, wrong, or low quality in generated image.
    - Infer, what the current diffusion model is failing to parse, and fix the phrasing

    {rules}

    Provide only new PROMPT as answer

  optimizer_fix_user: |
    INTENT:
    {intent}

    PROMPT:
    {prompt}

  optimizer_mutate_system: |
    You are an expert prompt engineer for text-to-image models.
    You are given a user INTENT plus a set of previously evaluated prompts, each with its overall score and the specific issues found.
    Create better prompt that fix the listed issues and build on what already works.

    How to proceed:
    - Study the scores and per-criterion issues for each previous prompt.
    - Keep the parts that already work and directly address the listed issues (missing or incorrect intent elements, quality, composition, or coherence problems).
    - Strengthen and recombine the phrasing so the diffusion model is more likely to parse and execute the prompt correctly.

    Output ONLY updated prompt.

    {rules}

  optimizer_mutate_user: |
    INTENT:
    {intent}

    PREVIOUS PROMPTS WITH THEIR EVALUATION FEEDBACK:
    {prompt_blocks}

  optimizer_mutate_prompt_block: |
    PROMPT {index} (overall score: {score}/1.0)
    {prompt}

    Issues to fix ({issues_count}):
    {fix}

  translate_system: |
    translate to english, or just copy if already in english

  create_custom_rubrics_system: |
    provide better rubrics for comparing generated images
    you will be given default rubrics
    you also will be given user intent, that intent used to generate images
    as answer provide ONLY new rubrics json

    Output FORMAT example:
    {
      "Visual Quality": {
        "weight": 3,
        "description": "..."
      }
    }

  create_custom_rubrics_user: |
    RUBRICS:
    {default_rubrics}

    INTENT:
    {intent}
